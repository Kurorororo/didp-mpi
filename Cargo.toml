[package]
name = "didp-mpi"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[features]
default = []
# Enables HAC memory CSVs and per-node lifetime tracking. Adds one handle/node.
memory-statistics = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dypdl = "0.8"
dypdl-heuristic-search = "0.8"
didp-yaml = "0.8"
mpi = "0.8"
zerocopy = "0.8"
yaml-rust = "0.4"
linked-hash-map = "0.5"
rustc-hash = "2.0"
rand = "0.8"
rand_pcg = "0.3"
memoffset = "0.9"

# Local 0.8.0 exposes the registry's existing signature-group count.
[patch.crates-io]
dypdl-heuristic-search = { path = "vendor/dypdl-heuristic-search" }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.5"

[profile.release]
lto = true
codegen-units = 1

[profile.release-with-debug]
inherits = "release"
debug = true
